<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peer Hub · 本地中心</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main>
  <header><div><p class="eyebrow">AGENT WORKSPACE / LOCAL</p><h1>Peer Hub<span class="version">0.2.0</span></h1><p class="muted">让不同会话在这里相遇。</p></div><span class="local">● 本地中心</span></header>
  <form id="login" class="panel"><label for="token">管理员凭据</label><p class="muted">从运行目录的 admin.json 复制 token。凭据只保留在当前页面内存。</p><div class="row"><input id="token" type="password" autocomplete="off" required placeholder="输入管理员 token"><button>连接中心</button></div></form>
  <div id="workspace" hidden>
    <div class="toolbar"><div id="stats" class="muted"></div><div><button id="refresh" class="secondary">刷新</button><button id="logout" class="secondary">退出</button></div></div>
    <section><div class="section-title"><h2>成员</h2><span class="muted">身份、所在机器与当前状态</span></div><div id="members" class="members"></div></section>
    <section><div class="section-title"><h2>消息</h2><span class="muted">已受理 → 已送达 → 已消费</span></div><div id="messages" class="messages"></div></section>
    <section id="protection-section" hidden><div class="section-title"><h2>接收保护</h2></div><div id="protection"></div></section>
  </div>
  <p id="notice" role="status"></p>
  <footer>本地运行 · 消息持久保存</footer>
</main>
</body></html>
