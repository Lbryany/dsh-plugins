<!-- page: one main visual, contextual summary and auditable rows. -->
<div id="analysis">
  <style>
    #analysis .analysis-bars { display: grid; gap: 24px; margin: 24px 0; }
    #analysis .analysis-bar { display: grid; grid-template-columns: 3em minmax(0, 1fr) 4em; align-items: center; gap: 12px; }
    #analysis .analysis-track { background: var(--card); height: 24px; }
    #analysis .analysis-fill { height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; }
    #analysis output { font-variant-numeric: tabular-nums; }
  </style>
  <header class="viz-page-header"><h1>季度销售观察</h1><form id="analysis-form" class="viz-controls"><label for="analysis-region">地区</label><select class="form-select" id="analysis-region" name="region"><option value="all">全部地区</option><option value="east">华东</option><option value="west">华西</option></select></form></header>
  <main class="viz-page">
    <p class="viz-lead">先看季度走势，再查看同一筛选下的原始明细。以下均为示例数据，金额单位为万元。</p>
    <div class="viz-layout viz-section">
      <section class="card" aria-labelledby="analysis-title"><h2 id="analysis-title">第二季度高于第一季度</h2><p class="text-small">共同刻度 0–200 万元 · 长度编码季度销售额</p><div class="analysis-bars"><div class="analysis-bar"><span>Q1</span><div class="analysis-track" aria-hidden="true"><div class="analysis-fill" id="analysis-q1-bar"></div></div><output id="analysis-q1">150</output></div><div class="analysis-bar"><span>Q2</span><div class="analysis-track" aria-hidden="true"><div class="analysis-fill" id="analysis-q2-bar"></div></div><output id="analysis-q2">200</output></div></div><p id="analysis-finding" aria-live="polite">第二季度比第一季度增长 33.3%。</p></section>
      <aside class="card"><h2>所选范围</h2><div class="viz-stat"><div>两季度合计 · 万元</div><output class="viz-stat-value" id="analysis-total">350</output></div><p class="text-small">合计与图表使用相同地区筛选。没有成本数据，不能据此推断利润。</p></aside>
    </div>
    <section class="viz-section"><h2>数据明细</h2><table><caption class="text-small">示例来源 · 本页内置四条记录</caption><thead><tr><th scope="col">地区</th><th scope="col">季度</th><th scope="col">销售额 / 万元</th></tr></thead><tbody id="analysis-rows"></tbody></table></section>
  </main>
</div>
<script>
(function () {
  var rows = [{ region: 'east', label: '华东', q: 'Q1', value: 100 }, { region: 'east', label: '华东', q: 'Q2', value: 140 }, { region: 'west', label: '华西', q: 'Q1', value: 50 }, { region: 'west', label: '华西', q: 'Q2', value: 60 }];
  var region = document.getElementById('analysis-region');
  function draw() {
    var selected = rows.filter(function (r) { return region.value === 'all' || r.region === region.value; });
    var totals = { Q1: 0, Q2: 0 }, tbody = document.getElementById('analysis-rows'); tbody.replaceChildren();
    selected.forEach(function (r) { totals[r.q] += r.value; var tr = document.createElement('tr'); [r.label, r.q, r.value].forEach(function (v) { var td = document.createElement('td'); td.textContent = v; tr.appendChild(td); }); tbody.appendChild(tr); });
    ['Q1', 'Q2'].forEach(function (q) { document.getElementById('analysis-' + q.toLowerCase()).textContent = totals[q]; document.getElementById('analysis-' + q.toLowerCase() + '-bar').style.width = (totals[q] / 200 * 100) + '%'; });
    document.getElementById('analysis-total').textContent = totals.Q1 + totals.Q2;
    document.getElementById('analysis-finding').textContent = '第二季度比第一季度增长 ' + ((totals.Q2 / totals.Q1 - 1) * 100).toFixed(1) + '%。';
  }
  dshViz.interaction({ form: document.getElementById('analysis-form'), fields: { region: { type: 'enum', values: ['all', 'east', 'west'] } }, action: { label: '分析所选地区', intent: '解释本次region对应地区的季度变化：all全部、east华东、west华西。示例销售额万元：华东Q1=100/Q2=140，华西Q1=50/Q2=60。不要推断原因或利润。' }, render: draw });
})();
</script>
